# PRD 7.9: every push to main deploys to production.
name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: production
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test api.tests
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci && npm run build
        working-directory: web
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: nama-api
          region: ${{ vars.GCP_REGION }}
          source: ./api
          flags: '--no-invoker-iam-check --cpu-boost --min-instances=0 --max-instances=1'
          # ALLOWED_EMAILS is quoted because it contains commas, which this action treats as separators.
          env_vars: |
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            ALLOWED_EMAILS="${{ vars.ALLOWED_EMAILS }}"
            APP_VERSION=${{ github.sha }}
            PUBLIC_ORIGIN=https://${{ vars.GCP_PROJECT_ID }}.web.app
      - run: npx firebase-tools@latest deploy --only hosting,firestore --project ${{ vars.GCP_PROJECT_ID }} --non-interactive
      # Smoke test: the live API must answer through Hosting with this commit id.
      - run: curl -fsS https://${{ vars.GCP_PROJECT_ID }}.web.app/api/health | tee /dev/stderr | grep -q "${{ github.sha }}"
      # Smoke test: calls without a token are refused (M1, NFR-03).
      - run: test "$(curl -sS -o /dev/null -w '%{http_code}' https://${{ vars.GCP_PROJECT_ID }}.web.app/api/me)" = 401
      # Smoke test: accepting an invite link needs a signed-in Google account (M10, AUTH-06).
      - run: test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://${{ vars.GCP_PROJECT_ID }}.web.app/api/invites/accept)" = 401
      # Smoke test: the Claude connector's sign-in is found through Hosting (MCP-02, MCP-06). Tried for about a
      # minute, because new Hosting rewrites take a moment to reach the CDN (the first run saw index.html).
      - run: |
          for attempt in 1 2 3 4 5; do
            curl -fsS https://${{ vars.GCP_PROJECT_ID }}.web.app/.well-known/oauth-authorization-server | grep -q '"issuer":"https://${{ vars.GCP_PROJECT_ID }}.web.app"' && exit 0
            sleep 10
          done
          curl -fsS https://${{ vars.GCP_PROJECT_ID }}.web.app/.well-known/oauth-authorization-server | tee /dev/stderr | grep -q '"issuer":"https://${{ vars.GCP_PROJECT_ID }}.web.app"'
      - run: |
          for attempt in 1 2 3 4 5; do
            curl -fsS https://${{ vars.GCP_PROJECT_ID }}.web.app/.well-known/oauth-protected-resource/api/mcp | grep -q '"resource":"https://${{ vars.GCP_PROJECT_ID }}.web.app/api/mcp"' && exit 0
            sleep 10
          done
          curl -fsS https://${{ vars.GCP_PROJECT_ID }}.web.app/.well-known/oauth-protected-resource/api/mcp | tee /dev/stderr | grep -q '"resource":"https://${{ vars.GCP_PROJECT_ID }}.web.app/api/mcp"'
      # Smoke test: the MCP server refuses a call without a token and says where to sign in (MCP-02, MCP-03).
      - run: |
          for attempt in 1 2 3 4 5; do
            curl -sS -o /dev/null -D - -X POST https://${{ vars.GCP_PROJECT_ID }}.web.app/api/mcp | grep -qi '^www-authenticate: Bearer resource_metadata="https://${{ vars.GCP_PROJECT_ID }}.web.app/.well-known/oauth-protected-resource/api/mcp"' && exit 0
            sleep 10
          done
          curl -sS -o /dev/null -D - -X POST https://${{ vars.GCP_PROJECT_ID }}.web.app/api/mcp | tee /dev/stderr | grep -qi '^www-authenticate: Bearer resource_metadata="https://${{ vars.GCP_PROJECT_ID }}.web.app/.well-known/oauth-protected-resource/api/mcp"'
